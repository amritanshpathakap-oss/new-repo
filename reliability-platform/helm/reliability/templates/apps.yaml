{{- range $name := list "gateway" "orders" "inventory" }}
---
apiVersion: {{ if eq $name "inventory" }}argoproj.io/v1alpha1{{ else }}apps/v1{{ end }}
kind: {{ if eq $name "inventory" }}Rollout{{ else }}Deployment{{ end }}
metadata:
  name: {{ $name }}
  labels: { app: {{ $name }}, part-of: reliability }
spec:
  {{- if ne $name "inventory" }}
  replicas: 2
  {{- else }}
  replicas: {{ $.Values.inventory.replicas }}
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 25
        - pause: {duration: 2m}
        - analysis:
            templates:
              - templateName: inventory-success-rate
        - setWeight: 50
        - pause: {duration: 2m}
  {{- end }}
  selector:
    matchLabels: { app: {{ $name }} }
  template:
    metadata:
      labels: { app: {{ $name }}, part-of: reliability }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault} }
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: SERVICE, value: {{ $name | quote }} }
            - {name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: {{ $.Values.otelEndpoint | quote }} }
            {{- if eq $name "inventory" }}
            - {name: FAULT_DELAY_MS, value: {{ $.Values.inventory.faultDelayMs | quote }} }
            - {name: INVENTORY_CONCURRENCY, value: {{ $.Values.inventory.concurrency | quote }} }
            {{- end }}
            {{- if eq $name "orders" }}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ $.Values.postgres.secretName }}, key: database-url}}
            - {name: REDIS_URL, value: "redis://redis:6379/0"}
            {{- end }}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: { app: {{ $name }}, part-of: reliability }
spec:
  selector: { app: {{ $name }} }
  ports: [{name: http, port: 8000, targetPort: http}]
{{- end }}
