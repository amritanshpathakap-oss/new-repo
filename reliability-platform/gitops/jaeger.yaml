apiVersion: apps/v1
kind: Deployment
metadata: {name: jaeger, namespace: observability}
spec:
  replicas: 1
  selector: {matchLabels: {app: jaeger}}
  template:
    metadata: {labels: {app: jaeger}}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.67.0
          env: [{name: COLLECTOR_OTLP_ENABLED, value: 'true'}]
          ports:
            - {name: otlp-http, containerPort: 4318}
            - {name: query, containerPort: 16686}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: jaeger-collector, namespace: observability}
spec:
  selector: {app: jaeger}
  ports:
    - {name: otlp-http, port: 4318}
    - {name: query, port: 16686}
